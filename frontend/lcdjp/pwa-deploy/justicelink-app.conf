# ------------------------------------------------------------------------------------------
# JusticeLink: app download, APK MIME type, and Android app-link verification
#
# WHERE: paste this INSIDE the existing  server { ... }  block that has
#        `server_name justicelinkug.org ...;` and `listen 443 ssl;`
#        placed ABOVE your generic  location / { proxy_pass ... }  block.
# ------------------------------------------------------------------------------------------

# Friendly install-page URLs (the page itself is served by Spring Boot as /download.html)
location = /download { rewrite ^ /download.html last; }
location = /get-app  { rewrite ^ /download.html last; }

# APK files live on the host (outside Docker): releasing a new APK needs no rebuild/redeploy.
location ^~ /downloads/ {
    alias /var/www/justicelink-downloads/;
    autoindex off;
    default_type application/octet-stream;
    types { application/vnd.android.package-archive apk; }
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
}

# Digital Asset Links: lets the Android app open in full screen with no browser address bar.
# Exact-match (=) location, so it also wins over any "deny hidden files" regex block.
location = /.well-known/assetlinks.json {
    alias /var/www/justicelink-downloads/assetlinks.json;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
}

# OPTIONAL: make sure browsers and Cloudflare always revalidate the service worker and manifest so
# updates reach phones quickly. Keep the proxy_* lines identical to your existing `location /` block.
location = /service-worker.js {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
}
location = /manifest.json {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-cache" always;
}
