server.address=0.0.0.0

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=30000
# Pool sized for the request threads below; override per host with DB_POOL_MAX_SIZE (MySQL max_connections is 151 by default).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:100}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:50}
server.tomcat.connection-timeout=20s

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.lcdjp=INFO
logging.level.org.springframework=WARN

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Behind Cloudflare/reverse proxy: rate-limit per real client IP, not the proxy address shared by everyone
app.trust-proxy-headers=true
app.cors.allow-localhost=false
