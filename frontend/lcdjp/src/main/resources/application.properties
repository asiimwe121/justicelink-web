spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/lcdjp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=10000&socketTimeout=30000}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:30000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Strict by default: a migration that was edited after it ran, or one numbered below the newest applied
# version, stops the deploy at startup instead of silently drifting production away from every other
# environment. Rolling deploys keep the old containers serving while the new one refuses to start.
# See db/migration/README.md before changing any of these.
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:true}
spring.flyway.out-of-order=${FLYWAY_OUT_OF_ORDER:false}
# One-time switch for a database that already has tables but no flyway_schema_history (a legacy install).
# Leave false once every environment has a history table.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=0

server.address=0.0.0.0
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.servlet.session.timeout=86400
server.servlet.session.cookie.max-age=86400
server.servlet.session.cookie.name=LCDJP_SESSION
server.servlet.session.tracking-modes=cookie

spring.session.redis.namespace=lcdjp:session
spring.session.timeout=86400s
server.forward-headers-strategy=framework
# How many proxies sit in front of the app (only used when app.trust-proxy-headers=true). 0 = legacy: believe the
# left-most X-Forwarded-For / CF-Connecting-IP, which a client can forge. N>=1 = believe the entry N from the right
# (1 = one nginx/Caddy, 2 = Cloudflare + nginx), which a client cannot forge.
app.trusted-proxy-hops=${TRUSTED_PROXY_HOPS:0}

app.max-request-body-bytes=${MAX_REQUEST_BODY_BYTES:15728640}

spring.web.resources.static-locations=classpath:/static/,file:/app/static/
spring.web.resources.add-mappings=true
spring.mvc.static-path-pattern=/**

# gzip text responses (the JS/CSS/HTML bundle is several MB uncompressed; users are on slow networks)
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml,application/manifest+json

spring.web.cors.enabled=false
# Localhost origins in the CORS allowlist: on for local development, off in the docker profile.
app.cors.allow-localhost=${CORS_ALLOW_LOCALHOST:true}
# Ceiling on all requests from one client IP per minute, across every path (0 disables). The per-path limit
# alone can be sidestepped by varying the URL.
app.rate-limit.global-per-ip-per-minute=${RATE_LIMIT_GLOBAL_PER_IP:600}

spring.devtools.livereload.enabled=false
spring.devtools.restart.enabled=false

legal.knowledge.auto-ingest-on-startup=${LEGAL_KNOWLEDGE_AUTO_INGEST:true}

jwt.secret=${JWT_SECRET}
system.admin.initial-password=${SYSTEM_ADMIN_INITIAL_PASSWORD:}
system.admin.email=${SYSTEM_ADMIN_EMAIL:info@justicelinkug.org}

# AI chat: Groq (OpenAI-compatible chat completions).
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.api.url=https://api.groq.com/openai/v1/chat/completions

# Backup chat provider: Gemini (OpenAI-compatible endpoint). Used only when the provider before it fails.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
# Optional: low / medium / high. Leave empty unless you switch to a "thinking" model that returns empty replies.
gemini.reasoning-effort=${GEMINI_REASONING_EFFORT:}

# Chat providers in the order they are tried; the first real reply wins. A provider with no key is skipped.
app.ai.providers=${AI_PROVIDERS:groq,gemini}

# Embeddings for RAG / legal knowledge only: Hugging Face (Groq has no embeddings endpoint).
huggingface.api.key=${HUGGINGFACE_API_KEY:}
huggingface.embedding.model=sentence-transformers/all-MiniLM-L6-v2
huggingface.embedding.api.url=https://router.huggingface.co/hf-inference/models/

google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
google.maps.public-key=${GOOGLE_MAPS_PUBLIC_KEY:${GOOGLE_MAPS_API_KEY:}}
# Map ID "JusticeLink-Map" (production map for justicelinkug.org); override per environment if needed
google.maps.map-id=${GOOGLE_MAPS_MAP_ID:b15458693c7d302b939562cc}

app.recaptcha.site-key=${RECAPTCHA_SITE_KEY:}
app.recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
# When Google cannot be reached: false = refuse logins (default, keeps bot protection); true = let people through.
app.recaptcha.fail-open-on-outage=${RECAPTCHA_FAIL_OPEN_ON_OUTAGE:false}

spring.cache.cache-names=emergencies,cases,statistics
spring.cache.redis.time-to-live=600000

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=true

spring.main.allow-circular-references=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=lcdjp
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.metrics.web.server.requests.autotime.enabled=true
management.metrics.web.client.requests.autotime.enabled=true

brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:support@justicelinkug.org}
brevo.sender.name=${BREVO_SENDER_NAME:JusticeLink Uganda}
# No new email attempt starts after this many milliseconds (checked between attempts).
brevo.retry-budget-ms=${BREVO_RETRY_BUDGET_MS:12000}
# Background pool for best-effort emails (login alert, welcome, approval). Queue overflow drops the email with a warning.
app.notifications.threads=${NOTIFICATION_THREADS:2}
app.notifications.queue-capacity=${NOTIFICATION_QUEUE_CAPACITY:200}
# Seconds to finish queued emails on shutdown; keep below the container stop grace period.
app.notifications.drain-seconds=${NOTIFICATION_DRAIN_SECONDS:30}

app.support.email=${SUPPORT_EMAIL:support@justicelinkug.org}
app.support.name=${SUPPORT_NAME:JusticeLink Support}
app.password-reset.link-ttl-minutes=${PASSWORD_RESET_LINK_TTL_MINUTES:60}

app.sms.provider=${SMS_PROVIDER:logging}
app.sms.africastalking.username=${AT_USERNAME:}
app.sms.africastalking.api-key=${AT_API_KEY:}
app.sms.africastalking.sender-id=${AT_SENDER_ID:}
app.sms.africastalking.sandbox=${AT_SANDBOX:false}
# USSD callback secret. Leave empty to keep USSD switched off. Set the Africa's Talking callback URL to /api/ussd?key=<this value>.
app.ussd.callback-key=${USSD_CALLBACK_KEY:}

app.account-retention.months=${ACCOUNT_RETENTION_MONTHS:6}
app.account-retention.cron=${ACCOUNT_RETENTION_CRON:0 30 2 * * *}
app.escalation.days=${ESCALATION_DAYS:3}
app.escalation.cron=${ESCALATION_CRON:0 15 * * * *}

# Machine translation of the interface into Ugandan languages (Sunbird AI).
app.translation.enabled=${TRANSLATION_ENABLED:true}
app.translation.sunbird.token=${SUNBIRD_API_TOKEN:}
app.translation.sunbird.url=${SUNBIRD_TRANSLATE_URL:https://api.sunbird.ai/tasks/translate}
app.translation.cache-max-entries=${TRANSLATION_CACHE_MAX_ENTRIES:20000}
app.translation.cache-ttl-hours=${TRANSLATION_CACHE_TTL_HOURS:24}
app.translation.parallelism=${TRANSLATION_PARALLELISM:4}
# Requests allowed inside the translation provider at once; over this the texts come back untranslated.
app.translation.max-concurrent=${TRANSLATION_MAX_CONCURRENT:6}
# Texts allowed to wait for a translation worker; extra texts are skipped and retried later.
app.translation.queue-capacity=${TRANSLATION_QUEUE_CAPACITY:100}

# Daily ceiling on estimated AI tokens (prompt + max completion) across all anonymous/public AI calls. 0 disables.
app.ai.daily-token-budget=${AI_DAILY_TOKEN_BUDGET:2000000}
# AI chat calls allowed in flight at once; over this the caller gets the normal fallback reply straight away.
app.ai.max-concurrent=${AI_MAX_CONCURRENT:8}

# When Redis is unreachable during the token-blacklist check: false = accept the token (outage doesn't
# log everyone out, but tokens that were logged out work again); true = reject it (safer, but all
# authenticated requests fail until Redis is back).
# Default false, deliberately: password resets, deactivation and "end all sessions" are enforced from MySQL
# (SessionRevocationService), so Redis only backs plain logouts. Redis is skipped for 15s after a failure
# so an outage does not make every request wait out the 2s Redis timeout. See TokenBlacklistService.
app.security.blacklist-fail-closed=${BLACKLIST_FAIL_CLOSED:false}

# Object storage for uploaded files (Cloudflare R2, Oracle Object Storage S3 API, AWS S3, MinIO). Leave the
# endpoint empty to keep every file in MySQL exactly as before. R2 endpoint looks like
# https://<account-id>.r2.cloudflarestorage.com and its region is "auto". See FileRefService.
app.storage.endpoint=${STORAGE_ENDPOINT:}
app.storage.bucket=${STORAGE_BUCKET:}
app.storage.access-key=${STORAGE_ACCESS_KEY:}
app.storage.secret-key=${STORAGE_SECRET_KEY:}
app.storage.region=${STORAGE_REGION:auto}
# Signs file references and download links. Falls back to JWT_SECRET when empty.
app.storage.url-secret=${STORAGE_URL_SECRET:}
# One-off: move files already stored in MySQL into the bucket at startup, then switch back off. See FileBackfillRunner.
app.storage.backfill.enabled=${STORAGE_BACKFILL_ENABLED:false}
