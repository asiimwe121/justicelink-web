name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Docker is available on the runner, so the Testcontainers MySQL migration test runs here too.
      - name: Build, test, coverage gate
        run: mvn -B -ntp verify
      - name: Coverage summary
        if: always()
        run: python3 scripts/jacoco-summary.py || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports
            target/site/jacoco

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check every script
        run: node scripts/check-frontend.mjs

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: |
          cp /dev/null .env
          REDIS_PASSWORD=x DB_PASSWORD=x MYSQL_ROOT_PASSWORD=x JWT_SECRET=x \
          GOOGLE_MAPS_API_KEY=x BREVO_API_KEY=x BREVO_SENDER_EMAIL=x HUGGINGFACE_API_KEY=x \
            docker compose config --quiet
      - name: Image builds
        if: hashFiles('Dockerfile') != ''
        run: docker build -t lcdjp-backend:ci .
      - name: Scan image for known vulnerabilities (HIGH and CRITICAL with a fix available)
        if: hashFiles('Dockerfile') != ''
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: lcdjp-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
